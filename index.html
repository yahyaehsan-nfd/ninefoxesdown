<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nine Foxes Down</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #154071;
    --peach: #FDDEC0;
  }

  html, body {
    height: 100%;
    font-family: 'Archivo', sans-serif;
    overflow: hidden;
  }

  .page {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  /* ─── Left: About Nine Foxes Down (navy) ─── */
  .side-about {
    flex: 1;
    background: var(--navy);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem;
  }

  .about-content {
    text-align: center;
    max-width: 460px;
  }

  .logo-mark {
    width: 200px;
    height: 200px;
    margin: 0 auto 2.5rem;
    display: block;
  }

  .logo-mark img,
  .logo-mark svg {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }

  .about-tagline {
    font-family: 'Archivo', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: 1rem;
  }

  .about-heading {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(2.6rem, 4.4vw, 4rem);
    font-weight: 900;
    color: #fff;
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin-bottom: 1.25rem;
    text-transform: uppercase;
  }

  .about-subtext {
    font-size: 1.05rem;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 2.5rem;
    line-height: 1.6;
    font-weight: 400;
  }

  .about-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    background: transparent;
    color: #fff;
    border: 2px solid rgba(255, 255, 255, 0.35);
    padding: 1.05rem 2.5rem;
    font-family: 'Archivo', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-radius: 60px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .about-btn:hover {
    background: #fff;
    color: var(--navy);
    border-color: #fff;
    transform: translateY(-2px);
  }

  .about-btn svg {
    width: 16px;
    height: 16px;
    transition: transform 0.25s ease;
  }

  .about-btn:hover svg {
    transform: translateX(3px);
  }

  /* ─── Right: Order Food (pastel peach) ─── */
  .side-order {
    flex: 1;
    background: var(--peach);
    display: flex;
    flex-direction: row;
    align-items: stretch;
    padding: 0;
    position: relative;
  }

  .order-image {
    flex: 1.05;
    overflow: hidden;
    position: relative;
  }

  .order-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  .order-content {
    flex: 1;
    text-align: left;
    padding: 3rem 3rem 3rem 2.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .order-tagline {
    font-family: 'Archivo', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--navy);
    opacity: 0.55;
    margin-bottom: 1rem;
  }

  .order-heading {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(2.6rem, 4.4vw, 4rem);
    font-weight: 900;
    color: var(--navy);
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin-bottom: 1.25rem;
    text-transform: uppercase;
  }

  .order-subtext {
    font-size: 1.05rem;
    color: var(--navy);
    opacity: 0.65;
    margin-bottom: 2.5rem;
    line-height: 1.6;
    font-weight: 400;
  }

  .order-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--navy);
    color: #fff;
    border: 2px solid var(--navy);
    padding: 1.05rem 2.5rem;
    font-family: 'Archivo', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-radius: 60px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .order-btn:hover {
    background: transparent;
    color: var(--navy);
    transform: translateY(-2px);
  }

  .order-btn svg {
    width: 16px;
    height: 16px;
    transition: transform 0.25s ease;
  }

  .order-btn:hover svg {
    transform: translateX(3px);
  }

  /* ─── Mobile: stack sections, fit screen height ─── */
  @media (max-width: 900px) {
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    .page {
      flex-direction: column;
      height: 100%;
      height: 100dvh;
    }

    /* Each section gets half the screen height */
    .side-about,
    .side-order {
      flex: 1 1 50%;
      min-height: 0;
      height: 50%;
    }

    .side-about {
      padding: clamp(1rem, 4vh, 2.5rem) 1.5rem;
    }
    .about-content {
      max-width: 100%;
    }
    .logo-mark {
      width: clamp(70px, 12vh, 110px);
      height: clamp(70px, 12vh, 110px);
      margin: 0 auto clamp(0.5rem, 1.5vh, 1rem);
    }
    .about-tagline {
      font-size: 0.7rem;
      margin-bottom: clamp(0.4rem, 1vh, 0.75rem);
    }
    .about-heading {
      font-size: clamp(1.4rem, 5vh, 2.2rem);
      margin-bottom: clamp(0.5rem, 1.2vh, 0.85rem);
    }
    .about-subtext {
      font-size: clamp(0.78rem, 1.6vh, 0.95rem);
      margin-bottom: clamp(0.75rem, 2vh, 1.4rem);
    }
    .about-btn {
      padding: clamp(0.6rem, 1.5vh, 0.85rem) 1.6rem;
      font-size: 0.8rem;
    }

    /* Order section: image left, content right (still side-by-side at 50% page height) */
    .side-order {
      flex-direction: row;
      padding: 0;
    }
    .order-image {
      flex: 1;
      height: 100%;
    }
    .order-content {
      flex: 1.1;
      padding: clamp(1rem, 3vh, 1.75rem) clamp(1rem, 4vw, 1.5rem);
      text-align: left;
      align-items: flex-start;
    }
    .order-tagline {
      font-size: 0.65rem;
      margin-bottom: clamp(0.3rem, 0.8vh, 0.6rem);
    }
    .order-heading {
      font-size: clamp(1.3rem, 4.5vh, 2rem);
      margin-bottom: clamp(0.4rem, 1vh, 0.75rem);
    }
    .order-subtext {
      font-size: clamp(0.74rem, 1.5vh, 0.88rem);
      margin-bottom: clamp(0.6rem, 1.5vh, 1.1rem);
    }
    .order-btn {
      padding: clamp(0.55rem, 1.4vh, 0.8rem) 1.4rem;
      font-size: 0.75rem;
    }
  }

  /* Very narrow phones (< 480px): stack image above content inside order section */
  @media (max-width: 480px) {
    .side-order {
      flex-direction: column;
    }
    .order-image {
      flex: 1.1;
      width: 100%;
    }
    .order-content {
      flex: 1;
      padding: clamp(0.75rem, 2vh, 1.25rem) 1.25rem;
      text-align: center;
      align-items: center;
    }
  }
</style>
</head>
<body>

<div class="page">

  <!-- Left: About Nine Foxes Down -->
  <section class="side-about">
    <div class="about-content">

      <!-- Nine Foxes Down brand emblem -->
      <div class="logo-mark">
        <img src="assets/Nine foxes down logo.svg" alt="Nine Foxes Down">
      </div>

      <p class="about-tagline">Est. 2024</p>
      <h2 class="about-heading">About<br>Nine Foxes Down</h2>
      <p class="about-subtext">Discover our story, our craft, and the passion behind every plate.</p>
      <button class="about-btn">
        Learn More
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </div>
  </section>

  <!-- Right: Order Food -->
  <section class="side-order">
    <div class="order-image">
      <img src="assets/order food.png" alt="Nine Foxes Down branded takeaway bag with grilled panini">
    </div>
    <div class="order-content">
      <p class="order-tagline">Freshly Prepared</p>
      <h1 class="order-heading">Online Order<br>Food Now</h1>
      <p class="order-subtext">Authentic flavors delivered to your door. Browse our menu and order in minutes.</p>
      <button class="order-btn">
        Order Now
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </div>
  </section>

</div>

</body>
</html>
